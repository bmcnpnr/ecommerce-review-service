server:
  port: 8087

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
      # Without eager-load, the ServiceInstanceListSupplier for a Feign client is
      # built lazily on first use and starts empty, so the very first call to a
      # peer fails with "Load balancer does not contain an instance".
      eager-load:
        clients: product-service
    # Spring Cloud CircuitBreaker, left on its defaults, hands every call to a worker thread behind a time limiter
    # (1 s, which silently cuts every slower call) and a bulkhead thread pool of one thread per CPU with a
    # 100-call queue (two concurrent calls in a 2-CPU container, the rest rejected). All three are off: the call
    # runs on the calling thread, Feign's connect and read timeouts below govern, and the breaker only counts.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # Fail fast on a peer that vanished mid-rollout (default connect
            # timeout is 10s) so the connection-failure retry in FeignConfig can
            # move on to the next instance; reads stay generous.
            connect-timeout: 2000
            read-timeout: 10000
  application:
    name: review-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/reviewdb}
    username: ${DB_USERNAME:reviewuser}
    password: ${DB_PASSWORD:reviewpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A request waits at most 5s for a connection (default 30s), then fails with a 503 instead of
      # queueing request threads behind a dead or saturated database.
      connection-timeout: 5000
      # pgjdbc defaults to no socket timeout: a database that stops answering (dropped packets, a frozen host, a
      # failover without a reset) would hold the request thread until the OS gives up, many minutes later. Hikari's
      # connection-timeout only bounds the wait for a connection, not a read on one that is already open.
      data-source-properties:
        connectTimeout: 5   # seconds
        socketTimeout: 30   # seconds a read may block; statements here take milliseconds
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    # Off: with it on, a read outside a transaction keeps its connection until the response has been
    # written, so slow clients drain the pool. Reads are @Transactional(readOnly) and return DTOs.
    open-in-view: false
    show-sql: false
    # No hibernate.dialect: Hibernate detects it from the connection (PostgreSQL
    # here, H2 under the test profile); setting it explicitly is deprecated.
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      # The Feign client's breaker is named after the client (FeignConfig.circuitBreakerNameResolver).
      product-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        # A product-service that answers, but slowly, still holds a request thread per call for up to the read
        # timeout (10 s). Calls over 5 s count as slow, and when 80 % of the window is slow the breaker opens
        # and the rest fail fast instead of piling up behind it.
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
        # Without this the breaker leaves OPEN only when a call is attempted, so an idle service stays
        # "open" in the metrics (and in the CircuitBreakerOpen alert) indefinitely.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A 4xx means the request was wrong or the thing does not exist: product-service is healthy.
        # Counting those would let a few requests for unknown product ids trip the breaker for everyone.
        ignoreExceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$MethodNotAllowed
          - feign.FeignException$NotAcceptable
          - feign.FeignException$Conflict
          - feign.FeignException$Gone
          - feign.FeignException$UnsupportedMediaType
          - feign.FeignException$UnprocessableEntity

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    # INFO by default; LOGGING_LEVEL_COM_ECOMMERCE=DEBUG turns debug on for a diagnosis.
    com.ecommerce: INFO
    # Hibernate writes two lines (WARN "SQL Error: ..." and ERROR with the message) for every failed JDBC call, with no
    # throttle: a pair per request for as long as the database is down. The exception handler's throttled line
    # carries the same cause once per window.
    org.hibernate.orm.jdbc.error: "OFF"
    # Logs "Application exception overridden by rollback exception" with a stack trace of several hundred lines for
    # every transaction that was in flight when its connection died (a killed backend, a database restart): up to one
    # per pooled connection. The exception handler reports the failure once per window, with the root cause.
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"
